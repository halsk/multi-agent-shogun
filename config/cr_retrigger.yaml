# cmd_908 T1: CodeRabbit rate-limited PR 自動再引き金 — 設定
#
# 設計: queue/reports/cmd908_ratelimit_retrigger_design.md
#   §1(allowlist)・§3.2(予算)・§9.1(上限の件数を持たない)・
#   §9.2(予備の問い合わせ)・§9.4(見直しの条件)
#
# ★上限の件数はここにも一切置かない(§9.1)。budget は CodeRabbit の割当の
# 推測ではなく、当家の試行の数を抑えるための自前の枷である。

enabled: true

# allowlist: halsk の PR のみを対象とする repo(§1)。
# 上流(yohey-w/*・digital-go-jp/*)はここに書かれてもコード側(is_allowed_repo)
# が拒む。
allowlist:
  - geolonia/geonicdb-console
  - geolonia/geonicdb
  - geolonia/skills
  - geolonia/geonicdb-docs

budget:
  # 引き金(`[AI] @coderabbitai review`)の自前の予算(確定版§9.1・追補2の勧め)。
  trigger_per_hour: 1
  trigger_per_day: 8
  # 予備の問い合わせ(`[AI] @coderabbitai rate limit`)の下限(確定版§9.2)。
  query_min_interval_min: 30
  query_per_day: 6

# 予備の問い合わせ(cr-decideのcheckが返すcommand)の投稿有効/無効。
# 既定は無効: cr-decideの答え(check)は常に記録するが、実際に
# `[AI] @coderabbitai rate limit` を投じるかはこのスイッチで絞る。
query:
  enabled: false

# cmd_913: 「決める」部分(cr-decide)の設定。
# geolonia/skillsのskills/coderabbit-pr-flow/scripts/cr-decide.mjsを
# 読み取り専用cloneの中で子プロセスとして呼ぶ(queue/reports/
# cmd913_crdecide_integration.md §5)。
cr_decide:
  enabled: true
  # cr-decide.mjs・policy.jsonの実物を取ってくる元repo。
  tool_repo: geolonia/skills
  script_relpath: skills/coderabbit-pr-flow/scripts/cr-decide.mjs
  policy_relpath: skills/coderabbit-pr-flow/policy.json
  # 読み取り専用cloneの置き場(allowlistの各repo + tool_repo自身の分)。
  clones_dir: state/cr_decide_clones
  node_bin: node
  timeout: 30
